; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:orb_drifter]
platform = ststm32
board = we_oceanus1_ev
framework = arduino
monitor_speed = 115200
debug_tool = stlink
upload_protocol = stlink
build_flags =  ; custom build flags, to allow more modern c++, putting information about the compilation into the firmware, etc
    !echo "-DREPO_GIT_BRANCH="$(git branch --show-current)
    !echo "-DREPO_COMMIT_ID="$(git log | head -1 | cut -c8-)  ; this is non portable, unix only; would need a python "pre platformio script" to get this to work portably...
    !echo "-DCOMPILING_HOST_NAME="$(hostname)  ; this is non portable, unix only; would need a python script else
    !echo "-DCOMPILING_USER_NAME="$(whoami)  ; this is non portable, unix only; would need a python script else
    !echo "-DREPO_BASENAME="$(basename `git rev-parse --show-toplevel`)
    !echo "-DPROJECT_NAME"=$(basename $(dirname "$PWD"))
		-I src
		; The console is the mySerial instance in main.cpp (USART1 on PB6/PB7). Do NOT
		; also point the global Serial at USART1 - two HardwareSerial objects on one
		; peripheral interleave their output mid-line.
lib_deps =
	etlcpp/Embedded Template Library
	jgromes/RadioLib@7.6.0
	adafruit/SdFat - Adafruit Fork    ;@^2.2.3
	milesburton/DallasTemperature     ;@^3.11.0
	stm32duino/STM32duino Low Power   ;@^1.3.0
	stm32duino/STM32duino RTC@~1.8.0  ; pin: RTC 2.0.0 needs STM32 core >2.12 (unreleased), and Low Power 1.5.0 still uses the old voidFuncPtr typedef
	stm32duino/STM32duino LSM6DSV16X  ;@^2.0.3  ; covers the LSM6DSV family (LSM6DSVTR, WHO_AM_I 0x70)
	paulstoffregen/Time				  ;@^1.6.1
lib_extra_dirs =
	../common_libraries/lora_transceiver
	../common_libraries/parser_utils
	../common_libraries/sd_writer
	../common_libraries/etl_error_manager
	../common_libraries/gps_manager
	../common_libraries/thermo_manager
	../common_libraries/wave_manager
	../common_libraries/stats
	../common_libraries/message_tools