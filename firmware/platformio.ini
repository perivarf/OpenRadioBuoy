; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Monorepo layout: this single project builds both firmware images.
; Each environment keeps its own sources under <project>/src and selects them
; with build_src_filter. PlatformIO's src_dir is global (not per-env), so it is
; set to this directory (firmware/) and the filters resolve relative to it.

[platformio]
src_dir = .

; --- Shared configuration -----------------------------------------------------
; The special [env] section is inherited by every [env:*] below. Environments
; only override what is actually different (sources, libraries, include paths).
[env]
platform = ststm32
board = lora_e5_mini
framework = arduino
monitor_speed = 115200
debug_tool = stlink
upload_protocol = stlink
build_flags =  ; custom build flags, to allow more modern c++, putting information about the compilation into the firmware, etc
    !echo "-DREPO_GIT_BRANCH="$(git branch --show-current)
    !echo "-DREPO_COMMIT_ID="$(git log | head -1 | cut -c8-)  ; this is non portable, unix only; would need a python "pre platformio script" to get this to work portably...
    !echo "-DCOMPILING_HOST_NAME="$(hostname)  ; this is non portable, unix only; would need a python script else
    !echo "-DCOMPILING_USER_NAME="$(whoami)  ; this is non portable, unix only; would need a python script else
    !echo "-DREPO_BASENAME="$(basename `git rev-parse --show-toplevel`)
    !echo "-DPROJECT_NAME"=$(basename $(dirname "$PWD"))
lib_deps =
	etlcpp/Embedded Template Library    ;@^20.39.4
	jgromes/RadioLib@7.6.0
	paulstoffregen/Time					;@^1.6.1
	adafruit/SdFat - Adafruit Fork		;@^2.2.3
lib_extra_dirs =
	common_libraries/lora_transceiver
	common_libraries/parser_utils
	common_libraries/sd_writer
	common_libraries/etl_error_manager
	common_libraries/message_tools

; --- Drifter ------------------------------------------------------------------
[env:orb_drifter]
build_src_filter = +<drifter/src/>
build_flags =
	${env.build_flags}
	; The console is the mySerial instance in main.cpp (USART1 on PB6/PB7). Do NOT
	; also point the global Serial at USART1 - two HardwareSerial objects on one
	; peripheral interleave their output mid-line.
	-I drifter/src
lib_deps =
	${env.lib_deps}
	milesburton/DallasTemperature     ;@^3.11.0
	; pin: Low Power 2.0.0 (published 2026-07-24) #errors out on any STM32 core
	; <= 2.12, and the platform pulls core 2.11.0. Unpinned, this dependency
	; drifted to 2.0.0 and broke the drifter build outright - nothing to do with
	; the wave message. 1.4.0 is the newest that still builds against 2.11.0.
	stm32duino/STM32duino Low Power@1.4.0
	stm32duino/STM32duino RTC@~1.8.0  ; pin: RTC 2.0.0 needs STM32 core >2.12 (unreleased), and Low Power 1.5.0 still uses the old voidFuncPtr typedef
	stm32duino/STM32duino LSM6DSV16X  ;@^2.0.3  ; covers the LSM6DSV family (LSM6DSVTR, WHO_AM_I 0x70)
lib_extra_dirs =
	${env.lib_extra_dirs}
	common_libraries/gps_manager
	common_libraries/thermo_manager
	common_libraries/wave_manager
	common_libraries/stats

; --- Drifter, bench test of the wave message ----------------------------------
; Same firmware as orb_drifter, but the GPS is never started and the GPS/thermo
; measurement is skipped, so a synthetic 'W' message can be serialised and sent
; indoors without waiting for a fix. The handshake is kept: it is the only way
; the drifter learns the base station's RX channel, which is derived from the
; base station's own WiO_ID (864 + 3*(WiO_ID % 20)/20).
[env:orb_drifter_test_wave]
extends = env:orb_drifter
build_flags =
	${env:orb_drifter.build_flags}
	-DDEBUG_WAVE_MSG=1

; --- Basestation --------------------------------------------------------------
[env:orb_basestation]
build_src_filter = +<basestation/src/>
debug_build_flags = -O2 -g2 -ggdb2
build_flags =
	${env.build_flags}
	-I basestation/src
lib_deps =
	${env.lib_deps}
	blues/Blues Wireless Notecard@^1.7.1
	densaugeo/base64@^1.4.0
lib_extra_dirs =
	${env.lib_extra_dirs}
	common_libraries/gsm
